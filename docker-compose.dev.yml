# Desarrollo local. Postgres es supabase-db (docker-compose.supabase.yml + override dev, vía include).
#
# Uso:
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d
#   (Studio opcional: añadir --profile admin -> http://127.0.0.1:54323)
#
# Flujo de base de datos: supabase-db-init (one-shot) carga config/database/init.sql si no existe
# public.usuarios y siempre aplica 004-rls-deny-all.sql. Para restaurar un dump: hacerlo ANTES del
# primer `up` completo (levantar solo supabase-db) o con psql contra 127.0.0.1:${POSTGRES_PORT:-5432}
# (usuario/base `postgres`); el init se salta la carga si `usuarios` ya existe.

include:
  - path:
      - docker-compose.supabase.yml
      - docker-compose.supabase.dev.yml

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: intranet_backend_dev
    environment:
      NODE_ENV: development
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-http://localhost:3000/auth/ms365/callback}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-dev_password_123}
      MSSQL_DB: ${MSSQL_DB:-bi_data}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./modules:/app/modules
      - ./config:/app/config
      - uploads_data:/app/uploads
      - /app/node_modules
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
    networks:
      - internal
    command: npm run dev:backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: intranet_frontend_dev
    environment:
      NODE_ENV: development
      VITE_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./modules/portal/frontend:/app/modules/portal/frontend
      - ./modules/auditoria/frontend:/app/modules/auditoria/frontend
      - ./modules/tickets/frontend:/app/modules/tickets/frontend
      - ./modules/rh/frontend:/app/modules/rh/frontend
      - ./modules/comercial/frontend:/app/modules/comercial/frontend
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - internal
    command: npm run dev:frontend

networks:
  internal:

volumes:
  uploads_data:
