worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:4000;
    }

    upstream frontend {
        server frontend:4173;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirigir todo HTTPS en producción
        # return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # API del backend
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Supabase self-hosted (docker-compose.supabase.yml) ---
        # Resolución dinámica: nginx arranca aunque el stack Supabase no esté desplegado.
        location /auth/v1/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $supabase_auth http://supabase-auth:9999;
            rewrite ^/auth/v1/(.*)$ /$1 break;
            proxy_pass $supabase_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Descargas por URL firmada. Storage valida la firma con la ruta original (X-Forwarded-Prefix).
        location /storage/v1/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $supabase_storage http://supabase-storage:5000;
            rewrite ^/storage/v1/(.*)$ /$1 break;
            proxy_pass $supabase_storage;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /storage/v1;
            client_max_body_size 50m;
        }

        # Frontend React
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
