# Lista blanca de GoTrue (/auth/v1/) expuesta al exterior. Contexto: http.
# Incluir UNA vez por nginx; cada `location /auth/v1/` hace `if ($auth_v1_permitido = 0) { return 403; }`.
# Por que: el navegador solo necesita el login Microsoft (authorize/callback), el refresh, el login por contraseña
# de cuentas locales, GET user y logout. Todo lo demas (recover, PUT/PATCH user, admin, signup, otp, magiclink,
# invite, verify, resend, reauthenticate, factors, sso...) queda cerrado (fail-closed). Ver docs/portal/auth-nginx.md.
#
# Clave = "<metodo> <valor crudo de ?grant_type> <$uri normalizado>". $uri ya viene decodificado y sin // . / ..
# (mismo valor que nginx reenvia a GoTrue tras el rewrite). \z (no $) para que un %0A final no evada el ancla.
# grant_type se compara crudo: grant_type=pass%77ord no coincide y se bloquea.
map "$request_method $arg_grant_type $uri" $auth_v1_permitido {
    default 0;
    "~^GET [^ ]* /auth/v1/(authorize|callback|user|settings|health|\.well-known/jwks\.json)\z" 1;
    "~^POST (refresh_token|pkce|password) /auth/v1/token\z" 1;
    "~^POST [^ ]* /auth/v1/logout\z" 1;
}
