server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Alineado con FILE_SIZE_LIMIT de Supabase Storage y los límites de multer
    client_max_body_size 50m;

    # Proxy API al backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Supabase self-hosted (docker-compose.supabase.yml) ---
    # Resolución dinámica: nginx arranca aunque el stack Supabase no esté desplegado.
    location /auth/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $supabase_auth http://supabase-auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $supabase_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Descargas por URL firmada. Storage valida la firma con la ruta original (X-Forwarded-Prefix).
    location /storage/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $supabase_storage http://supabase-storage:5000;
        rewrite ^/storage/v1/(.*)$ /$1 break;
        proxy_pass $supabase_storage;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /storage/v1;
        client_max_body_size 50m;
    }

    # React Router — todas las rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
