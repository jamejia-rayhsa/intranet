version: "3.8"

# Proyecto propio: sin esto comparte nombre ("intranet") y servicio ("postgres") con el compose de
# desarrollo, y `npm test` recrea el contenedor de dev heredando su volumen de datos.
name: intranet-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: intranet_postgres_test
    environment:
      POSTGRES_DB: intranet_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_123
    ports:
      - "5433:5432"
    volumes:
      - ./config/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: intranet_backend_test
    environment:
      NODE_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: intranet_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_123
    ports:
      - "4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run test --workspace=modules/portal/backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: intranet_frontend_test
    environment:
      NODE_ENV: test
      VITE_API_URL: /api
    ports:
      - "3001:5173"
    depends_on:
      - backend
