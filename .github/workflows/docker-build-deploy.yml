name: Docker Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intranet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Ejecutar migraciones
        run: npm run db:migrate
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: intranet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123

      - name: Ejecutar pruebas
        run: npm test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: intranet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
          JWT_SECRET: test_secret_ci
          NODE_ENV: test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      #id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Iniciar sesión en el registro
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
