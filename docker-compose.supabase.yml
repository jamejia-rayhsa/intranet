# Stack Supabase self-hosted (mínimo): Postgres + Auth (GoTrue) + Storage.
# No se levanta solo: lo incluyen docker-compose.{dev,staging,prod}.yml con `include:`
# (comparten la red `internal`). Por ejemplo:
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# Variables: ver .env.supabase.example (se agregan al .env del entorno).
# Secretos nuevos: scripts/supabase/generar-secretos.sh
#
# Base de datos: supabase-db es el ÚNICO Postgres de la app (base `postgres`, usuario `postgres`).
# `supabase-db-init` (one-shot) carga config/database/init.sql si no existe public.usuarios y
# luego aplica siempre 004-rls-deny-all.sql (idempotente). Para restaurar un dump: hacerlo
# ANTES del primer `up` completo (levantar solo supabase-db y restaurar con psql) o con psql
# contra supabase-db; el init se salta la carga si `usuarios` ya existe.
#
# Basado en https://github.com/supabase/supabase/tree/master/docker (versiones fijadas).
# Diferencias deliberadas respecto al compose oficial:
#   - Sin gateway (Envoy/Kong): nginx enruta /auth/v1/ y /storage/v1/ directo a los servicios.
#   - Sin realtime, edge-functions, analytics, supavisor ni imgproxy.
#   - PostgREST queda solo como dependencia interna de Storage; nunca se expone.
#   - Studio + postgres-meta solo con el perfil `admin`.
#   - Sin gateway, Studio solo ofrece Table/SQL editor (los paneles Auth/Storage no funcionan).

name: intranet-supabase

services:
  supabase-db:
    image: supabase/postgres:17.6.1.136
    container_name: intranet_supabase_db
    restart: unless-stopped
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      # Passwords de roles internos y JWT exp (scripts oficiales; requieren superusuario)
      - ./config/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./config/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - supabase_db_config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      # La imagen de Supabase exige que la base se llame `postgres`
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # One-shot: esquema base + RLS. Seguro de re-ejecutar; siempre sale con código 0 si todo va bien.
  supabase-db-init:
    image: supabase/postgres:17.6.1.136
    container_name: intranet_supabase_db_init
    restart: "no"
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGHOST: supabase-db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - ./config/database/init.sql:/sql/init.sql:ro
      - ./modules/portal/backend/migrations/004-rls-deny-all.sql:/sql/004-rls-deny-all.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        existe=$$(psql -tAc "SELECT to_regclass('public.usuarios') IS NOT NULL")
        if [ "$$existe" = "t" ]; then
          echo "[db-init] public.usuarios ya existe: se omite init.sql"
        else
          echo "[db-init] cargando init.sql"
          psql --single-transaction -v ON_ERROR_STOP=1 -f /sql/init.sql
        fi
        echo "[db-init] aplicando 004-rls-deny-all.sql"
        psql -v ON_ERROR_STOP=1 -f /sql/004-rls-deny-all.sql
        echo "[db-init] listo"
    networks:
      - internal

  supabase-auth:
    image: supabase/gotrue:v2.196.0
    container_name: intranet_supabase_auth
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:?Define SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      # POSTGRES_PASSWORD debe ser URL-safe (hex/alfanumérica): va dentro de una URL
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres

      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-${SUPABASE_PUBLIC_URL}}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_REDIRECT_URLS:-}
      # Las altas las hace un admin desde el portal (Admin API), no auto-registro
      GOTRUE_DISABLE_SIGNUP: ${SUPABASE_DISABLE_SIGNUP:-true}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Define SUPABASE_JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${SUPABASE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Intranet Rayhsa}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      # Microsoft Entra ID (Azure AD) single-tenant
      GOTRUE_EXTERNAL_AZURE_ENABLED: ${AZURE_AD_ENABLED:-false}
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_AZURE_URL: https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:-common}/v2.0
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    networks:
      - internal

  # Solo dependencia interna de Storage. No se enruta desde nginx.
  supabase-rest:
    image: postgrest/postgrest:v14.17
    container_name: intranet_supabase_rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    command: ["postgrest"]
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - internal

  supabase-storage:
    image: supabase/storage-api:v1.74.0
    container_name: intranet_supabase_storage
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?Define SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Define SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      # nginx quita /storage/v1 y lo manda en X-Forwarded-Prefix (necesario para URLs firmadas)
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase_storage_data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  # ---- Perfil `admin`: docker compose ... --profile admin up -d ----
  supabase-meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: intranet_supabase_meta
    profiles: [admin]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Define PG_META_CRYPTO_KEY}
    networks:
      - internal

  supabase-studio:
    image: supabase/studio:2026.09.07-sha-7996410
    container_name: intranet_supabase_studio
    profiles: [admin]
    restart: unless-stopped
    depends_on:
      - supabase-meta
    ports:
      # Solo loopback: acceder por túnel SSH / VPN
      - "127.0.0.1:${SUPABASE_STUDIO_PORT:-54323}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public
      DEFAULT_ORGANIZATION_NAME: Rayhsa
      DEFAULT_PROJECT_NAME: Intranet
      SUPABASE_URL: http://supabase-auth:9999
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
    networks:
      - internal

networks:
  internal:

volumes:
  supabase_db_data:
  supabase_db_config:
  supabase_storage_data:
